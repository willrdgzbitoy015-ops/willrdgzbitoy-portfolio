<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Browser-tab icon: "W." in the style of the navbar's "Will." mark (navy tile, white W,
    violet dot). The full "Will." is unreadable at tab size (16 px), so the icon keeps the
    first letter and the dot. The letters are drawn as shapes, not text, so the icon looks
    the same on every computer, with or without the Inter font.
  -->
  <defs>
    <!-- Cuts the W's pointed corners flat at the top and the bottom, like Inter Bold -->
    <clipPath id="cap"><rect x="0" y="9" width="32" height="14" /></clipPath>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="#0F1430" />
  <g transform="translate(0.3 0)">
    <!-- The W is one thick zig-zag line; its tips poke past the clip box and get cut flat. -->
    <polyline
      points="5.25,6.2 9.75,23 13.5,9 17.25,23 21.75,6.2"
      fill="none"
      stroke="#EEF1FF"
      stroke-width="3.3"
      stroke-linejoin="miter"
      stroke-miterlimit="10"
      clip-path="url(#cap)"
    />
    <circle cx="25.4" cy="21.35" r="1.65" fill="#9B6BFF" />
  </g>
</svg>
